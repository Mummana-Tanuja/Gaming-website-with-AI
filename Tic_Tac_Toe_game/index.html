<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-panel" aria-labelledby="game-title">
      <div class="game-header">
        <p class="eyebrow">Classic game</p>
        <h1 id="game-title">Tic Tac Toe</h1>
        <p id="status" class="status" role="status" aria-live="polite">Player X's turn</p>
      </div>

      <div class="scoreboard" aria-label="Scoreboard">
        <div>
          <span class="score-label">Player X</span>
          <strong id="score-x">0</strong>
        </div>
        <div>
          <span class="score-label">Draws</span>
          <strong id="score-draw">0</strong>
        </div>
        <div>
          <span class="score-label">Player O</span>
          <strong id="score-o">0</strong>
        </div>
      </div>

      <div class="board" role="grid" aria-label="Tic Tac Toe board">
        <button class="cell" role="gridcell" aria-label="Cell 1"></button>
        <button class="cell" role="gridcell" aria-label="Cell 2"></button>
        <button class="cell" role="gridcell" aria-label="Cell 3"></button>
        <button class="cell" role="gridcell" aria-label="Cell 4"></button>
        <button class="cell" role="gridcell" aria-label="Cell 5"></button>
        <button class="cell" role="gridcell" aria-label="Cell 6"></button>
        <button class="cell" role="gridcell" aria-label="Cell 7"></button>
        <button class="cell" role="gridcell" aria-label="Cell 8"></button>
        <button class="cell" role="gridcell" aria-label="Cell 9"></button>
      </div>

      <div class="actions">
        <button id="new-round" class="secondary-button" type="button">New round</button>
        <button id="reset-game" class="primary-button" type="button">Reset score</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
